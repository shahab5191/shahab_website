<!doctype html>

        <button id="contact-button" data-section="contact">Contact</button>
      </div>
    </header>
    <div class="content" id="content">
      <div class="menu-wrapper">
        <ul class="menu">
          <li class="item" data-section="about" data-number="01" data-short="ABOUT">

          <li class="item" data-section="education" data-number="03" data-short="EDU">

          </li>
        </ul>
        <button
          id="menu-collapse-bar"
          class="menu-collapse-bar"
          type="button"
          aria-label="Expand menu and close content"
        ></button>
      </div>
      <div id="content-view" class="content-view" aria-hidden="true">
        <div id="content-view-inner" class="content-view-inner"></div>
      </div>
    </div>

    <template data-content="about">
      <section class="section" data-section-content="about">

        <h2 class="section-title">About me</h2>
      </section>
    </template>
    <template data-content="experience">

    <template data-content="skills">

    <template data-content="projects">

    <script type="module" src="/src/ui/main.ts"></script>
    <script>
      const terminalModeButton = document.getElementById("terminal-mode");
      terminalModeButton.addEventListener("click", () => {
        window.parent.postMessage("hide-ui", "*");
      });
