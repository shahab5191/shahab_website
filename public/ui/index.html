<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRT Terminal Portfolio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1 style="color: white">Hello World</h1>
    <button id="terminal-mode">Terminal</button>
    <p style="color: white">Test</p>
  </body>
</html>

<script>
  const terminalModeButton = document.getElementById("terminal-mode");
  terminalModeButton.addEventListener("click", () => {
    window.parent.postMessage("hide-ui", "*");
  });
</script>
